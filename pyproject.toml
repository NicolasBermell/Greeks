[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "greeks"
version = "0.1.0"
description = "Benchmark of Option Greeks: Malliavin Calculus vs. Standard Methods"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "seaborn",
    "matplotlib",
    "quantlib",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["Methods*", "Benchmarks*", "Utilities*", "pricers*"]
